version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: mediconnect_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - mediconnect

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mediconnect_backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/mediconnect
      JWT_SECRET: mediconnect_super_secret_jwt_key_2026_change_in_prod
      JWT_EXPIRE: 30d
      JWT_COOKIE_EXPIRE: 30
      FRONTEND_URL: http://localhost:3000
    depends_on:
      - mongo
    networks:
      - mediconnect

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mediconnect_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - mediconnect

volumes:
  mongo_data:

networks:
  mediconnect:
    driver: bridge
